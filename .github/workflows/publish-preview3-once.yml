name: Publish QS3D CAD preview.3 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-preview3-once.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'trinhtanphat/QS3D-CAD'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: c33698efb80b259ed2ec02f1f79142256a35e8c9
      RELEASE_VERSION: 0.1.0-preview.3
      RELEASE_TAG: v0.1.0-preview.3
    steps:
      - name: Checkout exact validated release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact source and release identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:SOURCE_SHA) { throw "Release checkout '$actual' does not match '$env:SOURCE_SHA'." }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $env:RELEASE_VERSION) { throw "VERSION '$version' does not match '$env:RELEASE_VERSION'." }
          git fetch --force --tags origin
          if (@(git tag --list $env:RELEASE_TAG).Count -gt 0) { throw "Tag '$env:RELEASE_TAG' already exists; refusing replacement." }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release '$env:RELEASE_TAG' already exists; refusing replacement." }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup 6." }
          }

      - name: Validate and package exact Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Publish immutable preview.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "artifacts/installer/QS3D-CAD-Setup-win-x64.exe"
          $checksum = "artifacts/installer/QS3D-CAD-Setup-win-x64.exe.sha256"
          if (-not (Test-Path $installer) -or -not (Test-Path $checksum)) { throw "Required release assets are missing." }
          $notes = @"
          Windows x64 self-contained installer for QS3D CAD $env:RELEASE_VERSION.

          Source SHA: $env:SOURCE_SHA

          Includes the interactive standalone reference workspace, QS3D application/installer branding, and the latest validated shared Platform hardening. This preview does not claim native DWG/ODA production qualification without separate exact-SHA native evidence.
          "@
          gh release create $env:RELEASE_TAG $installer $checksum --target $env:SOURCE_SHA --title "QS3D CAD $env:RELEASE_VERSION" --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Failed to create preview.3 release." }

      - name: Verify published tag assets and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags origin
          $target = (git rev-list -n 1 $env:RELEASE_TAG).Trim().ToLowerInvariant()
          if ($target -ne $env:SOURCE_SHA) { throw "Published tag '$env:RELEASE_TAG' points to '$target', expected '$env:SOURCE_SHA'." }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,assets | ConvertFrom-Json
          if ($release.tagName -ne $env:RELEASE_TAG) { throw "Published release tag mismatch." }
          if (-not [bool]$release.isPrerelease) { throw "Published release is not marked prerelease." }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @('QS3D-CAD-Setup-win-x64.exe','QS3D-CAD-Setup-win-x64.exe.sha256')) {
            if ($names -notcontains $required) { throw "Published release is missing '$required'." }
          }
          $sidecar = (Get-Content "artifacts/installer/QS3D-CAD-Setup-win-x64.exe.sha256" -Raw).Trim().Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash "artifacts/installer/QS3D-CAD-Setup-win-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sidecar -ne $actual) { throw "Installer checksum sidecar does not match installer bytes." }
          Write-Host "QS3D CAD preview.3 publication PASS: $env:RELEASE_TAG -> $target SHA256=$actual"
