name: QS3D CAD CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup 6." }
          }

      - name: Run authoritative validation
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Build Windows x64 installer smoke
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -SkipValidation
          if ($LASTEXITCODE -ne 0) { throw "Windows installer packaging failed with exit code $LASTEXITCODE." }
          $installer = "artifacts/installer/QS3D-CAD-Setup-win-x64.exe"
          $checksum = "artifacts/installer/QS3D-CAD-Setup-win-x64.exe.sha256"
          if (-not (Test-Path $installer)) { throw "Windows installer was not produced." }
          if (-not (Test-Path $checksum)) { throw "Windows installer checksum was not produced." }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $declared = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($declared -ne $actual) { throw "Windows installer checksum sidecar does not match the installer." }
          Write-Host "Windows x64 installer PASS: $installer"

      - name: Build product-family bootstrapper package smoke
        shell: pwsh
        run: |
          ./scripts/package-family-bootstrapper.ps1 -SkipValidation
          if ($LASTEXITCODE -ne 0) { throw "Family bootstrapper packaging failed with exit code $LASTEXITCODE." }
          $paths = @(
            "artifacts/family-bootstrapper/QS3D-Family-Setup-win-x64.exe",
            "artifacts/family-bootstrapper/product-family.manifest.json"
          )
          foreach ($path in $paths) {
            $sidecar = "$path.sha256"
            if (-not (Test-Path $path)) { throw "Missing family bootstrapper artifact: $path" }
            if (-not (Test-Path $sidecar)) { throw "Missing SHA-256 sidecar: $sidecar" }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $declared = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            if ($actual -ne $declared) { throw "Family bootstrapper sidecar mismatch: $path" }
          }
          Write-Host "QS3D family bootstrapper package smoke PASS"

      - name: Retain validated Windows artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: QS3D-CAD-${{ github.sha }}-win-x64
          path: |
            artifacts/installer/QS3D-CAD-Setup-win-x64.exe
            artifacts/installer/QS3D-CAD-Setup-win-x64.exe.sha256
            artifacts/family-bootstrapper/QS3D-Family-Setup-win-x64.exe
            artifacts/family-bootstrapper/QS3D-Family-Setup-win-x64.exe.sha256
            artifacts/family-bootstrapper/product-family.manifest.json
            artifacts/family-bootstrapper/product-family.manifest.json.sha256
          if-no-files-found: error
          retention-days: 30
