name: QS3D CAD CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run authoritative validation
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Publish self-contained Windows x64 smoke
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $out = Join-Path $env:RUNNER_TEMP "qs3d-cad-publish"
          dotnet publish src/QS3D.Cad.Desktop/QS3D.Cad.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$version `
            -p:PublishReadyToRun=false `
            -o $out
          if ($LASTEXITCODE -ne 0) { throw "Windows x64 publish failed with exit code $LASTEXITCODE." }
          $exe = Join-Path $out "QS3D.CAD.exe"
          if (-not (Test-Path $exe)) { throw "Published QS3D.CAD.exe was not produced." }
          Write-Host "Windows x64 publish PASS: $exe"
