name: QS3D CAD CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "recovery/**"
      - "integration/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact task SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact checkout SHA
        shell: pwsh
        run: |
          $expected = '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'.ToLowerInvariant()
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checkout SHA mismatch: expected $expected, actual $actual" }
          Write-Host "Exact source SHA: $actual"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup 6." }
          }

      - name: Run authoritative validation
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Build Windows x64 installer smoke
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -SkipValidation
          if ($LASTEXITCODE -ne 0) { throw "Windows installer packaging failed with exit code $LASTEXITCODE." }
          $installer = "artifacts/installer/QS3D-CAD-Setup-win-x64.exe"
          $checksum = "artifacts/installer/QS3D-CAD-Setup-win-x64.exe.sha256"
          if (-not (Test-Path $installer)) { throw "Windows installer was not produced." }
          if (-not (Test-Path $checksum)) { throw "Windows installer checksum was not produced." }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $declared = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($declared -ne $actual) { throw "Windows installer checksum sidecar does not match the installer." }
          Write-Host "Windows x64 installer PASS: $installer"

      - name: Retain validated Windows installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: QS3D-CAD-${{ github.sha }}-win-x64
          path: |
            artifacts/installer/QS3D-CAD-Setup-win-x64.exe
            artifacts/installer/QS3D-CAD-Setup-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
