name: Verify QS3D CAD Published Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-preview.2
      TARGET_SHA: a3c0e6d098f02c8cfbb594020b20930491339d59
      INSTALLER_NAME: QS3D-CAD-Setup-win-x64.exe
      CHECKSUM_NAME: QS3D-CAD-Setup-win-x64.exe.sha256
      INSTALLER_SHA256: 5f6912569bbc43bbcfb7bdd18c902c35457aa91964c5d3b6f01264174d5c562e
    steps:
      - name: Verify published tag source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "Release tag $RELEASE_TAG points to $actual, expected $TARGET_SHA" >&2
            exit 1
          fi
          echo "Published tag source PASS: $RELEASE_TAG -> $actual"

      - name: Verify published release assets and checksum
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == "true" ]]
          names="$(jq -r '.assets[].name' <<<"$release_json")"
          grep -Fxq "$INSTALLER_NAME" <<<"$names"
          grep -Fxq "$CHECKSUM_NAME" <<<"$names"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" --pattern "$INSTALLER_NAME" --pattern "$CHECKSUM_NAME"
          actual_hash="$(sha256sum "$work/$INSTALLER_NAME" | awk '{print tolower($1)}')"
          declared_hash="$(awk '{print tolower($1); exit}' "$work/$CHECKSUM_NAME")"
          if [[ "$actual_hash" != "$INSTALLER_SHA256" || "$declared_hash" != "$INSTALLER_SHA256" ]]; then
            echo "Published installer checksum mismatch: actual=$actual_hash declared=$declared_hash expected=$INSTALLER_SHA256" >&2
            exit 1
          fi
          echo "Published release checksum PASS: $actual_hash"
