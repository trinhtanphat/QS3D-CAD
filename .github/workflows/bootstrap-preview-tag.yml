name: Bootstrap QS3D CAD Preview Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-preview-tag.yml

permissions:
  actions: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 14b0d374769cb571bb5150654ea8f0e209ea658d
    steps:
      - name: Verify validated source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TARGET_SHA must be an exact 40-character lowercase commit SHA." >&2
            exit 1
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq '.sha')"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "Resolved source $actual does not match validated SHA $TARGET_SHA" >&2
            exit 1
          fi
          echo "Validated exact release source: $actual"

      - name: Dispatch current release workflow for exact source
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-windows.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_release=RELEASE \
            -f "source_sha=$TARGET_SHA"
          echo "Dispatched current release workflow for exact source $TARGET_SHA"
