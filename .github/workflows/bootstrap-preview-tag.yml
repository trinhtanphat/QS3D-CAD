name: Bootstrap QS3D CAD Preview Tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-preview-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-preview.1
      TARGET_SHA: 8eacfd48867227a59470649692038d0373656aaa
    steps:
      - name: Create immutable preview tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$TARGET_SHA" ]]; then
              echo "Tag $TAG already points to $existing, expected $TARGET_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already points to the validated SHA."
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TARGET_SHA" >/dev/null

          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$actual" = "$TARGET_SHA"
          echo "Created $TAG -> $actual"
